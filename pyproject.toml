[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldops"
version = "0.1.0"
description = "Inspectable infrastructure world model and placement benchmark"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
worldops = "worldops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
